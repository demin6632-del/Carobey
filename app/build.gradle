plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pokoritel.bashni'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pokoritel.bashni'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

// Копируем существующую игру без изменения game.html в Android assets
// WebView загружает её из android_asset/game.html

tasks.register('copyGameHtml', Copy) {
    from '../game.html'
    into 'src/main/assets'
}

preBuild.dependsOn copyGameHtml
