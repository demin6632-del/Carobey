<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны: Башня</title><style>body{background:#070b12;color:#eee;font-family:Arial;margin:0}#app{max-width:520px;margin:auto;padding:15px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:15px;margin:10px 0}button{width:100%;padding:14px;margin:5px;background:#312e81;color:white;border:0;border-radius:10px}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.towerSave||'null')||{hero:null,floor:1,room:0,hp:100,max:100,enemy:null,ehp:0,boss:false,stairs:false,gold:0,log:'',kills:0};
function save(){localStorage.towerSave=JSON.stringify(s)}function btn(t,f){return `<button onclick="${f}">${t}</button>`}
function render(){app.innerHTML=`<h1>Хроники Бездны: Башня</h1><div class=card>Герой: ${s.hero||'нет'}<br>Этаж: ${s.floor}<br>Комната: ${s.room}/5<br>HP: ${s.hp}/${s.max}<br>Золото: ${s.gold}<br>${s.log}</div>`+view()}
function view(){if(!s.hero)return btn('Начать восхождение','start()');if(s.hp<=0)return btn('Начать заново','reset()');if(s.enemy)return `<div class=card>Враг: ${s.enemy}<br>HP: ${s.ehp}</div>`+btn('Атаковать','attack()');if(s.stairs)return btn('Подняться выше','nextFloor()');return btn('Исследовать комнату','explore()')}
function start(){s.hero='Искатель';save();render()}
function explore(){s.room++;if(s.room>=5){s.boss=true;s.enemy='Страж этажа';s.ehp=80+s.floor*20;s.log='Появился босс этажа'}else if(Math.random()<0.5){s.enemy='Тварь Бездны';s.ehp=30+s.floor*10;s.log='В комнате враг'}else{s.gold+=5;s.log='Найдена награда'}save();render()}
function attack(){s.ehp-=20;if(s.ehp<=0){if(s.boss){s.boss=false;s.stairs=true;s.log='Страж побеждён. Лестница открыта'}else{s.enemy=null;s.gold+=10;s.kills++;s.log='Враг побеждён. Получена награда'}}else{s.hp-=10}save();render()}
function nextFloor(){s.floor++;s.room=0;s.stairs=false;s.log='Новый этаж башни';save();render()}
function reset(){localStorage.removeItem('towerSave');location.reload()}render();</script></body></html>
