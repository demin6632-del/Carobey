<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны: Башня</title><style>body{background:#070b12;color:#eee;font-family:Arial;margin:0}#app{max-width:520px;margin:auto;padding:15px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:15px;margin:10px 0}button{width:100%;padding:14px;margin:5px;background:#312e81;color:white;border:0;border-radius:10px}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.towerSave||'null')||{hero:null,floor:1,room:0,hp:100,max:100,atk:20,def:5,gold:0,xp:0,level:1,enemy:null,ehp:0,boss:false,dead:false,status:null,skill:'Удар Бездны'};
function save(){localStorage.towerSave=JSON.stringify(s)}function b(t,f){return `<button onclick="${f}">${t}</button>`}function render(){app.innerHTML=`<h1>Хроники Бездны: Башня</h1><div class=card>Этаж ${s.floor}<br>Комната ${s.room}/5<br>Уровень ${s.level}<br>HP ${s.hp}/${s.max}<br>⚔${s.atk} 🛡${s.def}<br>💰${s.gold}<br>${s.status||''}</div>`+view()}function view(){if(!s.hero)return b('Начать восхождение','start()');if(s.dead)return '<div class=card>Герой пал</div>'+b('Заново','restart()');if(s.event)return `<div class=card>${s.event}</div>`+b('Рискнуть','eventRisk()')+b('Отступить','eventLeave()');if(s.enemy)return `<div class=card>${s.boss?'👑 БОСС ':''}${s.enemy}<br>HP ${s.ehp}</div>`+b('Атака','attack()')+b(s.skill,'skill()')+b('Зелье','heal()');return b('Исследовать этаж','explore()')}function start(){s.hero='Искатель';save();render()}function restart(){localStorage.removeItem('towerSave');location.reload()}function explore(){s.room++;s.status=null;if(s.room>=5){s.room=0;s.floor++}if(Math.random()<0.2){s.event='Таинственный алтарь предлагает силу. Цена неизвестна.'}else if(Math.random()<0.75){s.enemy=['Тень','Рыцарь Бездны','Проклятый зверь'][Math.floor(Math.random()*3)];s.ehp=50+s.floor*20;s.boss=false;if(s.floor%5==0){s.enemy='Владыка этажа';s.ehp=300+s.floor*40;s.boss=true}}else{s.gold+=40}save();render()}function eventRisk(){if(Math.random()<.5){s.atk+=10;s.status='Сила алтаря'}else{s.hp-=30;s.status='Проклятие'}s.event=null;save();render()}function eventLeave(){s.event=null;save();render()}function attack(){fight(s.atk)}function skill(){fight(s.atk*3);s.skill='Перезарядка'}function fight(d){s.ehp-=d;if(s.ehp<=0)win();else enemyHit()}function enemyHit(){s.hp-=Math.max(3,15-s.def);if(s.hp<=0)s.dead=true;save();render()}function heal(){s.hp=Math.min(s.max,s.hp+40);save();render()}function win(){s.gold+=s.boss?300:30;s.enemy=null;s.boss=false;s.xp+=30;s.skill='Удар Бездны';if(s.xp>=100){s.level++;s.xp=0;s.atk+=5;s.max+=15;s.hp=s.max}save();render()}render();</script></body></html>
