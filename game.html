<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны: Башня</title><style>body{background:#070b12;color:#eee;font-family:Arial;margin:0}#app{max-width:520px;margin:auto;padding:15px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:15px;margin:10px 0}button{width:100%;padding:14px;margin:5px 0;background:#312e81;color:white;border:0;border-radius:10px}.hp{color:#fb7185}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.towerSave||'null')||{hero:null,floor:1,room:0,hp:100,max:100,atk:20,def:5,weapon:'Ржавый меч',armor:'Кожаная броня',enemy:null,ehp:0,boss:false,gold:0,log:[]};
function save(){localStorage.towerSave=JSON.stringify(s)}
function render(){let a=document.getElementById('app');a.innerHTML=`<h1>Хроники Бездны: Башня</h1><div class=card>Этаж ${s.floor}<br>Комната ${s.room}/5<br>Герой: ${s.hero||'нет'}<br>HP: <span class=hp>${s.hp}/${s.max}</span><br>Оружие: ${s.weapon}<br>Броня: ${s.armor}<br>Золото: ${s.gold}</div>`+view()}
function b(t,f){return `<button onclick="${f}">${t}</button>`}
function view(){if(!s.hero)return `<div class=card>Выбери героя</div>`+b('Воин','start()');if(s.enemy)return `<div class=card>Враг: ${s.enemy}<br>HP врага: ${s.ehp}</div>`+b('Атаковать','attack()')+b('Навык удара','skill()');return `<div class=card>Исследуй башню и найди лестницу.</div>`+b('Исследовать','explore()')+b('Сохранить','save()')}
function start(){s.hero='Последний искатель';save();render()}
function explore(){s.room++;if(s.room>=5){s.room=0;if(s.floor%5==0){s.enemy='Страж этажа';s.ehp=120+s.floor*10;s.boss=true}else{s.floor++;s.log.push('Лестница найдена');}}else if(Math.random()<0.7){s.enemy=['Тень','Проклятый рыцарь','Зверь Бездны'][Math.floor(Math.random()*3)];s.ehp=40+s.floor*8}s.gold+=5;save();render()}
function attack(){let dmg=s.atk; s.ehp-=dmg;if(s.ehp<=0){s.gold+=20;s.enemy=null;s.boss=false}else{s.hp-=Math.max(5,15-s.def)}save();render()}
function skill(){s.ehp-=s.atk*2;save();if(s.ehp<=0){s.enemy=null;s.gold+=30}else{s.hp-=5}render()}
render();
</script></body></html>
