<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны: Башня</title><style>body{background:#070b12;color:#eee;font-family:Arial;margin:0}#app{max-width:520px;margin:auto;padding:15px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:15px;margin:10px 0}button{width:100%;padding:14px;margin:5px 0;background:#312e81;color:white;border:0;border-radius:10px}.hp{color:#fb7185}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.towerSave||'null')||{hero:null,floor:1,room:0,hp:100,max:100,atk:20,def:5,weapon:'Ржавый меч',armor:'Кожаная броня',gold:0,xp:0,level:1,enemy:null,ehp:0,boss:false,inv:[],log:[]};
function save(){localStorage.towerSave=JSON.stringify(s)}
function btn(t,f){return `<button onclick="${f}">${t}</button>`}
function render(){document.getElementById('app').innerHTML=`<h1>Хроники Бездны: Башня</h1><div class=card>Этаж: ${s.floor}<br>Комната: ${s.room}/5<br>Уровень: ${s.level}<br>HP: <span class=hp>${s.hp}/${s.max}</span><br>Атака: ${s.atk}<br>Защита: ${s.def}<br>Оружие: ${s.weapon}<br>Броня: ${s.armor}<br>Золото: ${s.gold}<br>Опыт: ${s.xp}</div>`+view()}
function view(){if(!s.hero)return btn('Начать восхождение','start()');if(s.enemy)return `<div class=card>Враг: ${s.enemy}<br>HP врага: ${s.ehp}</div>`+btn('Атаковать','attack()')+btn('Сильный удар','skill()');return `<div class=card>Исследуй этаж и найди лестницу.</div>`+btn('Исследовать комнату','explore()')+btn('Персонаж','character()')+btn('Сохранить','save()')}`}
function start(){s.hero='Последний искатель';save();render()}
function character(){alert('Инвентарь: '+(s.inv.join(', ')||'пусто'));}
function explore(){s.room++;let r=Math.random();if(s.room>=5){s.room=0;if(s.floor%5==0){s.enemy='Босс этажа';s.ehp=150+s.floor*15;s.boss=true}else{s.floor++;s.log.push('Найдена лестница')}}else if(r<0.65){s.enemy=['Тень','Проклятый рыцарь','Зверь Бездны'][Math.floor(Math.random()*3)];s.ehp=40+s.floor*10}else if(r<0.8){s.gold+=25;s.inv.push('Артефакт');}else{s.hp=Math.min(s.max,s.hp+15)}save();render()}
function attack(){s.ehp-=s.atk;if(s.ehp<=0)win();else s.hp-=Math.max(5,15-s.def);save();render()}
function skill(){s.ehp-=s.atk*2;if(s.ehp<=0)win();else s.hp-=5;save();render()}
function win(){s.xp+=20;s.gold+=25;if(s.boss){s.floor++;s.boss=false}s.enemy=null;if(s.xp>=100){s.level++;s.xp=0;s.atk+=5;s.max+=10;s.hp=s.max}}
render();
</script></body></html>
