<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны: Башня</title><style>body{background:#070b12;color:#eee;font-family:Arial;margin:0}#app{max-width:520px;margin:auto;padding:15px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:15px;margin:10px 0}button{width:100%;padding:14px;margin:5px 0;background:#312e81;color:white;border:0;border-radius:10px}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.towerSave||'null')||{hero:null,floor:1,room:0,hp:100,max:100,atk:20,def:5,gold:0,xp:0,level:1,enemy:null,ehp:0,boss:false,dead:false,effect:null,inv:['Зелье'],weapon:'Ржавый меч'};
function save(){localStorage.towerSave=JSON.stringify(s)}function b(t,f){return `<button onclick="${f}">${t}</button>`}
function render(){app.innerHTML=`<h1>Хроники Бездны: Башня</h1><div class=card>Этаж ${s.floor}<br>Комната ${s.room}/5<br>Уровень ${s.level}<br>HP ${s.hp}/${s.max}<br>⚔ ${s.atk}<br>🛡 ${s.def}<br>💰 ${s.gold}<br>${s.effect?'Эффект: '+s.effect:''}</div>`+view()}
function view(){if(s.dead)return '<div class=card>Герой пал</div>'+b('Начать заново','restart()');if(!s.hero)return b('Начать восхождение','start()');if(s.enemy)return `<div class=card>${s.boss?'👑 БОСС: ':''}${s.enemy}<br>HP врага: ${s.ehp}</div>`+b('Атаковать','attack()')+b('Удар Бездны','skill()')+b('Зелье','potion()');return b('Исследовать комнату','explore()')+b('Инвентарь','inventory()')}
function start(){s.hero='Последний искатель';save();render()}function restart(){localStorage.removeItem('towerSave');location.reload()}
function inventory(){app.innerHTML='<div class=card>Инвентарь</div>'+s.inv.map((x,i)=>b(x,'useItem('+i+')')).join('')+b('Назад','render()')}
function useItem(i){if(s.inv[i]=='Зелье'){s.hp=Math.min(s.max,s.hp+40);s.inv.splice(i,1)}else{s.atk+=10}s.save;save();render()}
function potion(){useItem(s.inv.indexOf('Зелье'))}
function explore(){s.room++;if(s.room>=5){s.room=0;if(s.floor%5==0){s.enemy=['Лорд Пепла','Древний Страж','Повелитель Бездны'][s.floor/5-1]||'Владыка Башни';s.ehp=300+s.floor*40;s.boss=true}else{s.floor++}}else if(Math.random()<.75){s.enemy=['Тень','Рыцарь Бездны','Проклятый зверь'][Math.floor(Math.random()*3)];s.ehp=60+s.floor*20;s.boss=false;if(Math.random()<.25)s.effect='яд'}else{s.gold+=40;s.inv.push('Зелье')}save();render()}
function attack(){damage(s.atk)}function skill(){damage(s.atk*3)}function damage(x){s.ehp-=x;if(s.ehp<=0)win();else hit()}
function hit(){let d=Math.max(5,20-s.def);if(s.effect=='яд')d+=5;s.hp-=d;if(s.hp<=0)s.dead=true;save();render()}
function win(){if(s.boss){s.gold+=300;s.inv.push('Клинок Бездны');s.floor++}else{s.gold+=30}s.enemy=null;s.boss=false;s.effect=null;s.xp+=30;if(s.xp>=100){s.level++;s.xp=0;s.atk+=5;s.max+=15;s.hp=s.max}save();render()}render();</script></body></html>
