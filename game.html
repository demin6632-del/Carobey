<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хроники Бездны: Башня</title><style>body{background:#070b12;color:#eee;font-family:Arial;margin:0}#app{max-width:520px;margin:auto;padding:15px}.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:15px;margin:10px 0}button{width:100%;padding:14px;margin:5px 0;background:#312e81;color:white;border:0;border-radius:10px}</style></head><body><div id="app"></div><script>
let s=JSON.parse(localStorage.towerSave||'null')||{hero:null,floor:1,room:0,hp:100,max:100,atk:20,def:5,gold:0,xp:0,level:1,enemy:null,ehp:0,dead:false,inv:['Зелье'],weapon:'Ржавый меч',armor:'Кожаная броня'};
const weapons={'Ржавый меч':0,'Клинок Бездны':10,'Меч древних':20};const armors={'Кожаная броня':0,'Броня тени':10,'Доспех башни':20};
function save(){localStorage.towerSave=JSON.stringify(s)}function b(t,f){return `<button onclick="${f}">${t}</button>`}
function render(){document.getElementById('app').innerHTML=`<h1>Хроники Бездны: Башня</h1><div class=card>Этаж ${s.floor}<br>Комната ${s.room}/5<br>Уровень ${s.level}<br>HP ${s.hp}/${s.max}<br>⚔ ${s.atk}<br>🛡 ${s.def}<br>Оружие: ${s.weapon}<br>Броня: ${s.armor}<br>💰 ${s.gold}</div>`+view()}
function view(){if(s.dead)return '<div class=card>Герой пал</div>'+b('Начать заново','restart()');if(!s.hero)return b('Начать восхождение','start()');if(s.enemy)return `<div class=card>Враг: ${s.enemy}<br>HP ${s.ehp}</div>`+b('Атаковать','attack()')+b('Навык','skill()')+b('Зелье','potion()');return b('Исследовать этаж','explore()')+b('Инвентарь','inventory()')+b('Персонаж','character()')}
function start(){s.hero='Последний искатель';save();render()}function restart(){localStorage.removeItem('towerSave');location.reload()}
function character(){alert('Герой: '+s.hero+'\nОружие: '+s.weapon+'\nБроня: '+s.armor)}
function inventory(){let h='<div class=card>Инвентарь</div>';for(let i=0;i<s.inv.length;i++)h+=b(s.inv[i]+' надеть','equip('+i+')');h+=b('Назад','render()');document.getElementById('app').innerHTML=h}
function equip(i){let x=s.inv[i];if(weapons[x]){s.atk-=weapons[s.weapon];s.weapon=x;s.atk+=weapons[x]}if(armors[x]){s.def-=armors[s.armor];s.armor=x;s.def+=armors[x]}save();render()}
function potion(){let i=s.inv.indexOf('Зелье');if(i>=0){s.inv.splice(i,1);s.hp=Math.min(s.max,s.hp+40)}save();render()}
function explore(){s.room++;let r=Math.random();if(s.room>=5){s.room=0;s.floor++}else if(r<.7){s.enemy=['Тень','Рыцарь Бездны','Зверь'][Math.floor(Math.random()*3)];s.ehp=50+s.floor*10}else{s.gold+=30;s.inv.push(Math.random()<.5?'Зелье':'Клинок Бездны')}save();render()}
function attack(){s.ehp-=s.atk;if(s.ehp<=0)win();else hit()}function skill(){s.ehp-=s.atk*2;if(s.ehp<=0)win();else hit()}function hit(){s.hp-=Math.max(5,15-s.def);if(s.hp<=0)s.dead=true;save();render()}
function win(){s.enemy=null;s.gold+=20;s.xp+=25;s.inv.push('Трофей врага');if(s.xp>=100){s.level++;s.xp=0;s.atk+=5;s.max+=15;s.hp=s.max}save();render()}render();</script></body></html>
